# Banco XYZ - plataforma de microservicios. Uso: docker compose up --build -d
x-java: &java
  restart: on-failure
  networks: [banco-net]
  environment: &env
    JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
    CONFIG_URL: http://config-server:8888
x-deps: &deps
  depends_on:
    config-server: {condition: service_healthy}
    eureka-server: {condition: service_healthy}
    postgres: {condition: service_healthy}
    kafka: {condition: service_started}
    auth-server: {condition: service_started}

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment: {POSTGRES_USER: banco, POSTGRES_PASSWORD: banco, POSTGRES_DB: postgres}
    volumes: ["./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro", "pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U banco"], interval: 5s, timeout: 3s, retries: 15}
    networks: [banco-net]

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m"
    networks: [banco-net]

  config-server:
    <<: *java
    build: {context: ., args: {MODULE: config-server}}
    container_name: config-server
    ports: ["8888:8888"]
    healthcheck: {test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"], interval: 5s, timeout: 3s, retries: 30, start_period: 20s}

  eureka-server:
    <<: *java
    build: {context: ., args: {MODULE: eureka-server}}
    container_name: eureka-server
    ports: ["8761:8761"]
    healthcheck: {test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761'"], interval: 5s, timeout: 3s, retries: 30, start_period: 20s}

  auth-server:
    <<: *java
    build: {context: ., args: {MODULE: auth-server}}
    container_name: auth-server
    ports: ["9000:9000"]
    depends_on: {eureka-server: {condition: service_healthy}}

  clientes-service:    # escalable: docker compose up -d --scale clientes-service=2
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: clientes-service}}

  cuentas-service:     # escalable
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: cuentas-service}}

  pagos-service:       # escalable
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: pagos-service}}

  notificaciones-service:
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: notificaciones-service}}

  bff-web:
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: bff-web}}

  bff-movil:
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: bff-movil}}

  bff-atm:
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: bff-atm}}

  batch-service:
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: batch-service}}
    volumes: ["./batch-data:/data:ro"]

  api-gateway:         # unico punto de entrada, HTTPS
    <<: [*java, *deps]
    build: {context: ., args: {MODULE: api-gateway}}
    container_name: api-gateway
    ports: ["8443:8443"]

networks:
  banco-net: {driver: bridge}
volumes:
  pgdata:
