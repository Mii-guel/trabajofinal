# Configuracion COMPARTIDA por todos los servicios (servida por Spring Cloud Config)
eureka:
  client.serviceUrl.defaultZone: http://eureka-server:8761/eureka
spring:
  security.oauth2.resourceserver.jwt.jwk-set-uri: http://auth-server:9000/oauth2/jwks
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  endpoints.web.exposure.include: health,info,metrics,circuitbreakers,retries
  endpoint.health.show-details: always
  health.circuitbreakers.enabled: true
logging.level.cl.banco: INFO
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 6
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
        ignoreExceptions: [org.springframework.web.client.HttpClientErrorException]
    instances:
      clientes: {baseConfig: default}
      cuentas: {baseConfig: default}
      pagos: {baseConfig: default}
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions: [org.springframework.web.client.HttpClientErrorException]
    instances:
      clientes: {baseConfig: default}
      cuentas: {baseConfig: default}
      pagos: {baseConfig: default}
